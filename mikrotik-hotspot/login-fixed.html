<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel WiFi Access</title>
    <style>
        :root {
            --bg-a: #0d1528;
            --bg-b: #1b2b50;
            --panel: rgba(13, 19, 35, 0.92);
            --panel-soft: rgba(23, 35, 64, 0.82);
            --line: rgba(255, 255, 255, 0.11);
            --text: #f5f8ff;
            --muted: #afbdd8;
            --brand: #ffb74d;
            --brand-2: #5de2cc;
            --ok: #6de49d;
            --warn: #ffdf6d;
            --danger: #ff8f8f;
            --radius: 18px;
            --radius-lg: 24px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 12%, rgba(93, 226, 204, 0.20), transparent 24%),
                radial-gradient(circle at 85% 5%, rgba(255, 183, 77, 0.22), transparent 24%),
                linear-gradient(140deg, var(--bg-a), var(--bg-b));
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: var(--panel);
            backdrop-filter: blur(8px);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
            padding: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            text-align: center;
            justify-content: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-weight: 800;
            color: #131313;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            font-size: 1.2rem;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        .sub {
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 0.86rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }

        .field input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            padding: 12px;
            outline: none;
            font-size: 1rem;
            font-family: inherit;
        }

        .field input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .field input:focus {
            border-color: rgba(93, 226, 204, 0.7);
            box-shadow: 0 0 0 3px rgba(93, 226, 204, 0.18);
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            margin-top: 8px;
        }

        .btn.main {
            background: linear-gradient(135deg, var(--brand), #ffe0b0);
            color: #1c1c1c;
        }

        .btn.main:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .status {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            margin-top: 16px;
        }

        .status h3 {
            font-size: 0.95rem;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .status p {
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.5;
            margin: 0;
        }

        .hint {
            margin-top: 10px;
            padding: 9px 11px;
            border-radius: 12px;
            font-size: 0.84rem;
            line-height: 1.45;
        }

        .hint.ok {
            color: #d8ffea;
            border: 1px solid rgba(109, 228, 157, 0.3);
            background: rgba(109, 228, 157, 0.12);
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            .brand {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand">
                <div class="logo">HS</div>
                <div>
                    <h1>Hostel WiFi</h1>
                    <p class="sub">Sign in to connect</p>
                </div>
            </div>

            <form method="post" action="$(link-login-only)">
                <input type="hidden" name="dst" value="$(link-orig-url)">
                <input type="hidden" name="popup" value="true">

                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn main">Sign In & Connect</button>
            </form>

            <section class="status">
                <h3>Network Information</h3>
                <p>IP: $(ip)</p>
                <p>MAC: $(mac)</p>
                <div class="hint ok">Connected to: $(identity)</div>
            </section>
        </div>
    </div>
</body>
</html>
