<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Dashboard - Apperstar Hotspot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* Status Card */
        .status-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status-card h2 {
            margin-bottom: 16px;
            font-size: 18px;
        }
        .status-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 20px 0;
        }
        .info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .info-value.time-remaining {
            color: #00a86b;
            font-size: 20px;
        }
        
        /* Timer */
        #countdown {
            font-size: 32px;
            font-weight: 700;
            color: #00a86b;
            text-align: center;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 8px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        
        /* Action Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #5de2cc;
            color: white;
        }
        .btn-primary:hover { background: #48c9b5; }
        .btn-secondary {
            background: #f0f1f3;
            color: #333;
        }
        .btn-secondary:hover { background: #e0e2e7; }
        .btn-danger {
            background: #f54e4e;
            color: white;
            grid-column: 1 / -1;
        }
        .btn-danger:hover { background: #e03a3a; }
        
        /* Package Cards */
        .packages-section {
            margin-top: 30px;
        }
        .packages-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .package-card {
            background: white;
            border: 2px solid #e0e2e7;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .package-card:hover {
            border-color: #5de2cc;
            box-shadow: 0 4px 12px rgba(93, 226, 204, 0.2);
        }
        .package-price {
            font-size: 20px;
            font-weight: 700;
            color: #5de2cc;
        }
        .package-duration {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        /* Auth Forms */
        .auth-form {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e2e7;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #5de2cc;
            box-shadow: 0 0 0 3px rgba(93, 226, 204, 0.1);
        }
        
        /* Alerts */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border-left: 4px solid #00a86b;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border-left: 4px solid #dc2626;
        }
        .alert-info {
            background: #f0f9ff;
            color: #0c4a6e;
            border-left: 4px solid #0284c7;
        }
        
        /* Loading state */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5de2cc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e2e7;
        }
        .tab {
            padding: 12px 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #999;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab.active {
            color: #5de2cc;
            border-bottom-color: #5de2cc;
        }
        
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div style="text-align: center; padding: 20px 0; border-bottom: 1px solid #e0e2e7; margin-bottom: 20px;">
            <h1 style="color: #5de2cc; margin-bottom: 4px;">Apperstar WiFi</h1>
            <p style="color: #999; font-size: 14px;">Fast, Reliable, Affordable Internet</p>
        </div>

        <!-- Connected Status -->
        <div id="connectedStatus" class="status-card" style="display: none;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <h2>✓ Connected</h2>
                <span style="font-size: 24px;">🟢</span>
            </div>
            
            <div id="countdown">00:10:00</div>
            
            <div class="status-info">
                <div class="info-item">
                    <div class="info-label">Package</div>
                    <div class="info-value" id="packageInfo">Trial 10 Min</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Phone</div>
                    <div class="info-value" id="phoneInfo">254...</div>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn-primary" onclick="buyMore()">💳 Buy More</button>
                <button class="btn-secondary" onclick="viewAccount()">👤 Account</button>
            </div>
            
            <button class="btn-danger" onclick="logout()">Logout & Disconnect</button>
        </div>

        <!-- Not Connected -->
        <div id="notConnected" class="status-card">
            <h2>🔌 Not Connected</h2>
            <p style="margin-top: 12px; color: #666;">Start your WiFi journey in 3 steps:</p>
            
            <div class="tabs" style="margin-top: 20px;">
                <button class="tab active" onclick="switchTab('login')">Sign In</button>
                <button class="tab" onclick="switchTab('register')">Register</button>
            </div>
            
            <!-- Login Tab -->
            <div id="loginTab" class="tab-content active">
                <div class="auth-form">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="loginPhone" placeholder="254712345678" pattern="^254[0-9]{9}$">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••">
                    </div>
                    <button class="btn-primary" onclick="handleLogin()" style="width: 100; margin-top: 12px;">Sign In</button>
                    <p style="text-align: center; margin-top: 16px; font-size: 13px; color: #999;">
                        Or try <a href="#" onclick="startTrial(); return false;" style="color: #5de2cc; text-decoration: none;">Free 10-Minute Trial</a>
                    </p>
                </div>
            </div>
            
            <!-- Register Tab -->
            <div id="registerTab" class="tab-content">
                <div class="auth-form">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="254712345678" pattern="^254[0-9]{9}$">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="regEmail" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="••••••••" minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="regPasswordConfirm" placeholder="••••••••">
                    </div>
                    <button class="btn-primary" onclick="handleRegister()" style="width: 100%; margin-top: 12px;">Create Account</button>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alertContainer"></div>
        
        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="loader"></div>
            <p style="margin-top: 12px; color: #999;">Processing...</p>
        </div>
    </div>

    <script>
        // Check if user is already connected
        function checkConnection() {
            const user = getCookie('hotspot_user');
            if (user) {
                showConnected();
                startCountdown();
            }
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
        }
        
        function showConnected() {
            document.getElementById('connectedStatus').style.display = 'block';
            document.getElementById('notConnected').style.display = 'none';
        }
        
        function showNotConnected() {
            document.getElementById('connectedStatus').style.display = 'none';
            document.getElementById('notConnected').style.display = 'block';
        }
        
        function startCountdown() {
            // Get remaining time from sessionStorage or estimates
            const stored = sessionStorage.getItem('hotspot_session');
            const userData = stored ? JSON.parse(stored) : null;
            let remaining = userData?.remaining_seconds || (10 * 60); // 10 minutes default for trial
            
            const interval = setInterval(() => {
                const hours = Math.floor(remaining / 3600);
                const mins = Math.floor((remaining % 3600) / 60);
                const secs = remaining % 60;
                
                document.getElementById('countdown').textContent = 
                    `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                
                if (remaining <= 0) {
                    clearInterval(interval);
                    showAlert('Your free WiFi time has expired. Please buy a package to continue.', 'info');
                    logout();
                }
                remaining--;
            }, 1000);
        }
        
        async function handleLogin() {
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!phone || !password) {
                showAlert('Please enter phone and password', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                const res = await fetch('https://18.156.45.197/system/user-auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=login&phone=${phone}&password=${password}`,
                    mode: 'cors',
                    credentials: 'include'
                });
                
                const data = await res.json();
                showLoading(false);
                
                if (data.status === 'success') {
                    document.cookie = `hotspot_user=${data.user.phone}; path=/`;
                    document.cookie = `hotspot_session=${data.session_id}; path=/`;
                    sessionStorage.setItem('hotspot_session', JSON.stringify(data));
                    showAlert('Logged in successfully!', 'success');
                    setTimeout(() => showConnected(), 1000);
                } else {
                    showAlert(data.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        async function handleRegister() {
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            
            if (!phone || !email || !password) {
                showAlert('Please fill all fields', 'error');
                return;
            }
            
            if (password !== confirm) {
                showAlert('Passwords do not match', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                const res = await fetch('https://18.156.45.197/system/user-auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=register&phone=${phone}&email=${email}&password=${password}&password_confirm=${confirm}`,
                    mode: 'cors',
                    credentials: 'include'
                });
                
                const data = await res.json();
                showLoading(false);
                
                if (data.status === 'success') {
                    showAlert('Registration successful! Now login to get started.', 'success');
                    document.getElementById('loginPhone').value = phone;
                    document.getElementById('loginPassword').value = '';
                    switchTab('login');
                } else {
                    showAlert(data.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        async function startTrial() {
            const phone = prompt('Enter your phone number (254XXXXXXXXX):');
            if (!phone) return;
            
            showLoading(true);
            try {
                const res = await fetch('https://18.156.45.197/system/hotspot-payment-api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `phone=${encodeURIComponent(phone)}&package=${encodeURIComponent(JSON.stringify({plan:"Trial 10 Minutes",price:0,duration:"10 minutes",system:"unlimited",usage:"General"}))}&device_mac=${encodeURIComponent(getCookie('mikrotik_mac') || 'aa:bb:cc:dd:ee:ff')}&device_ip=${encodeURIComponent(getCookie('mikrotik_ip') || '0.0.0.0')}&router=hotspot`,
                    mode: 'cors',
                    credentials: 'include'
                });
                
                const data = await res.json();
                showLoading(false);
                
                if (data.status === 'success') {
                    document.cookie = `hotspot_user=${data.username}; path=/`;
                    document.cookie = `hotspot_session=${data.session_id}; path=/`;
                    sessionStorage.setItem('hotspot_session', JSON.stringify(data));
                    showAlert('Trial activated! Logging you in...', 'success');
                    
                    // Auto-login to MikroTik with received credentials
                    setTimeout(() => {
                        // Try to login via MikroTik's captive portal login
                        const loginForm = document.createElement('form');
                        loginForm.method = 'post';
                        loginForm.action = '/login'; // MikroTik's captive portal login endpoint
                        loginForm.style.display = 'none';
                        
                        const userField = document.createElement('input');
                        userField.type = 'hidden';
                        userField.name = 'username';
                        userField.value = data.username;
                        
                        const passField = document.createElement('input');
                        passField.type = 'hidden';
                        passField.name = 'password';
                        passField.value = data.password;
                        
                        loginForm.appendChild(userField);
                        loginForm.appendChild(passField);
                        document.body.appendChild(loginForm);
                        loginForm.submit();
                    }, 500);
                } else {
                    showAlert(data.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        function buyMore() {
            showAlert('Buy more packages feature coming soon!', 'info');
        }
        
        function viewAccount() {
            showAlert('Account management feature coming soon!', 'info');
        }
        
        function logout() {
            document.cookie = 'hotspot_user=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC';
            document.cookie = 'hotspot_session=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC';
            sessionStorage.removeItem('hotspot_session');
            showNotConnected();
            showAlert('You have been logged out', 'info');
        }
        
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);
            
            setTimeout(() => alert.remove(), 4000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        
        // Initialize on page load
        window.addEventListener('load', checkConnection);
    </script>
</body>
</html>
