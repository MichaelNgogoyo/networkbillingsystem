name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote app directory
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /home/${{ secrets.VPS_USER }}/networkbillingsystem"

      - name: Sync project to VPS (tar stream)
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.runtime' \
            -czf - . \
            | ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "tar -xzf - -C /home/${{ secrets.VPS_USER }}/networkbillingsystem"

      - name: Deploy on VPS
        shell: bash
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "\
            cd /home/${{ secrets.VPS_USER }}/networkbillingsystem && \
            TZ='${{ vars.TZ }}' \
            MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            MYSQL_DATABASE='${{ vars.MYSQL_DATABASE }}' \
            MYSQL_USER='${{ vars.MYSQL_USER }}' \
            MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD }}' \
            APP_DOMAIN='${{ vars.APP_DOMAIN }}' \
            ./deploy/deploy.sh"
